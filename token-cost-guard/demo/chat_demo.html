<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Demo - Your App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --bg-subtle: #f8fafc;
            --fg: #09090b;
            --fg-muted: #52525b;
            --border: #e4e4e7;
            --input-bg: #ffffff;
            --input-border: #d4d4d8;
            --btn-bg: #09090b;
            --btn-fg: #ffffff;
            --success: #15803d;
            --error: #b91c1c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 24px;
            font-size: 14px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header { margin-bottom: 20px; }
        h1 { margin: 0 0 6px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--fg); }
        .subtitle { color: var(--fg-muted); font-size: 13px; }
        .card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 18px;
        }
        .messages {
            min-height: 240px;
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 14px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 14px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 6px;
            max-width: 82%;
            font-size: 13px;
            line-height: 1.5;
        }
        .msg.user {
            background: var(--fg);
            color: #ffffff;
            align-self: flex-end;
        }
        .msg.assistant {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--fg);
            align-self: flex-start;
        }
        .input-row { display: flex; gap: 8px; }
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--fg);
            font-size: 13px;
            font-family: inherit;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--fg);
            box-shadow: 0 0 0 1px var(--fg);
        }
        button {
            background: var(--btn-bg);
            color: var(--btn-fg);
            border: 1px solid var(--btn-bg);
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            font-family: inherit;
            transition: opacity 0.15s ease;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .status {
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--fg-muted);
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Simulated Client Application</h1>
        <p class="subtitle">Demonstration client communicating through Token Cost Guard proxy.</p>
    </div>

    <div class="card">
        <div class="messages" id="messages">
            <div class="msg assistant">Connected to Token Cost Guard proxy. Requests are counted, budgeted, and verified in real time.</div>
        </div>
        <div class="input-row">
            <input type="text" id="chatInput" placeholder="Type a message..." value="What is a proxy server?">
            <button id="sendBtn">Send</button>
        </div>
        <div class="status" id="status"></div>
    </div>
</div>

<script>
    const messagesDiv = document.getElementById('messages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('status');

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        const userMsg = document.createElement('div');
        userMsg.className = 'msg user';
        userMsg.textContent = text;
        messagesDiv.appendChild(userMsg);
        chatInput.value = '';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        sendBtn.disabled = true;
        statusDiv.textContent = 'Routing through proxy...';

        try {
            const start = Date.now();
            const res = await fetch('/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': 'sk-ant-api01-demo-key-000000'
                },
                body: JSON.stringify({
                    model: 'claude-3-haiku-20240307',
                    messages: [{ role: 'user', content: text }],
                    max_tokens: 256
                })
            });
            const elapsed = Date.now() - start;
            const data = await res.json();

            const estCost = res.headers.get('x-tcg-estimated-cost');
            const spent = res.headers.get('x-tcg-spent-today');

            if (res.ok && data.content) {
                const reply = data.content.map(c => c.text || '').join('');
                const assistantMsg = document.createElement('div');
                assistantMsg.className = 'msg assistant';
                assistantMsg.textContent = reply;
                messagesDiv.appendChild(assistantMsg);
                statusDiv.textContent = `[OK] ${elapsed}ms | est: $${parseFloat(estCost || 0).toFixed(6)} | spent today: $${parseFloat(spent || 0).toFixed(6)}`;
            } else {
                const errMsg = document.createElement('div');
                errMsg.className = 'msg assistant';
                errMsg.style.borderColor = 'var(--error)';
                errMsg.textContent = `Error ${res.status}: ${data.error || data.message || JSON.stringify(data)}`;
                messagesDiv.appendChild(errMsg);
                statusDiv.textContent = `[FAIL] ${res.status} - ${data.error || 'error'}`;
            }
        } catch (e) {
            statusDiv.textContent = `[ERROR] ${e.message}`;
        } finally {
            sendBtn.disabled = false;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
